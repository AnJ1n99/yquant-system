name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    container: ubuntu:24.04

    steps:
      # 容器里没有 git，actions/checkout 需要它；
      # clang-19 位于 noble-updates/universe，官方 ubuntu:24.04 镜像默认已启用该组件，
      # 无需额外配置 apt 源。
      - name: 安装工具链
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            git ca-certificates clang-19 cmake ninja-build

      - uses: actions/checkout@v4

      # 直接调用与本地相同的脚本：一次构建 Release 与 Debug 两套，
      # 任一失败即返回非零。
      - name: 构建 Release 与 Debug
        run: ./scripts/build.sh
